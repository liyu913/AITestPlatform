# 方式一：全栈一键启动。在仓库根目录执行：docker compose up -d --build
name: raina-testhub

x-backend-env: &backend-env
  TZ: Asia/Shanghai
  MYSQL_DSN: mysql+pymysql://raina:raina@mysql:3306/raina
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  MILVUS_HOST: milvus
  MILVUS_PORT: "19530"
  UPLOAD_DIR: /data/uploads
  JWT_SECRET: ${JWT_SECRET:-change-me-in-env}
  SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-lOaibadCJM2dC3_Ne0xhlxlD9FbzVs_M8xOGboKlyP8=}
  LLM_API_KEY: ${LLM_API_KEY:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  MIDSCENE_MODEL_API_KEY: ${MIDSCENE_MODEL_API_KEY:-}
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin123}

services:
  mysql:
    image: mysql:8.4
    container_name: raina-testhub-stack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rainaroot}
      MYSQL_DATABASE: raina
      MYSQL_USER: raina
      MYSQL_PASSWORD: raina
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uraina", "-praina"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - raina-testhub-stack-network

  redis:
    image: redis:7-alpine
    container_name: raina-testhub-stack-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raina-testhub-stack-network

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: raina-testhub-stack-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      TZ: Asia/Shanghai
    volumes:
      - etcd_data:/etcd
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    networks:
      - raina-testhub-stack-network

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: raina-testhub-stack-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TZ: Asia/Shanghai
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    networks:
      - raina-testhub-stack-network

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: raina-testhub-stack-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      TZ: Asia/Shanghai
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HEALTH_PORT:-9091}:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - raina-testhub-stack-network

  backend:
    image: raina-testhub-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: raina-testhub-stack-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      <<: *backend-env
    volumes:
      - upload_data:/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
    networks:
      - raina-testhub-stack-network

  worker:
    # 与 backend 共用镜像，勿再写 build，否则并行导出会抢同一 tag
    image: raina-testhub-backend:local
    pull_policy: never
    container_name: raina-testhub-stack-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-l", "info", "-Q", "ui,celery"]
    environment:
      <<: *backend-env
    volumes:
      - upload_data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - raina-testhub-stack-network

  celery-beat:
    image: raina-testhub-backend:local
    pull_policy: never
    container_name: raina-testhub-stack-celery-beat
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "-l", "info"]
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - raina-testhub-stack-network

  frontend:
    image: raina-testhub-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: raina-testhub-stack-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - raina-testhub-stack-network

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  upload_data:

networks:
  raina-testhub-stack-network:
    driver: bridge
