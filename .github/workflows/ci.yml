name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      # Unit + sqlite-backed integration tests only. Tests that need MySQL,
      # Redis or Playwright are skipped unless LY_INTEGRATION=1 is set (see
      # backend/tests/conftest.py).
      - name: Run tests
        run: uv run pytest -q
      - name: Verify the release migration chain
        run: uv run pytest tests/test_migration_chain.py -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build

  # Optional end-to-end job. Enable it on a runner that provides MySQL, Redis
  # and Playwright browsers, then set LY_INTEGRATION=1 to run the gated tests.
  #
  # e2e:
  #   runs-on: self-hosted
  #   env:
  #     LY_INTEGRATION: "1"
  #     MYSQL_DSN: mysql+pymysql://raina:raina@127.0.0.1:3306/raina
  #     CELERY_BROKER_URL: redis://127.0.0.1:6379/0
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: ./scripts/backup-restore-drill.sh restore /backups/latest --into-scratch
  #       working-directory: .
