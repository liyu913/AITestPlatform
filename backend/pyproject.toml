[project]
name = "raina-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "pymysql>=1.1",
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.0.1,<4.1",
  "python-jose[cryptography]>=3.3",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "httpx>=0.27",
  "pymilvus>=2.4",
  "pypdf>=6.10.2",
  "python-docx>=1.2.0",
  "captcha>=0.7.1",
  "pillow>=10.0",
  "playwright>=1.49",
  "Appium-Python-Client>=4.0",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "croniter>=2.0",
  "locust>=2.32",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.services.ai" = ["skill_resources/test-case-generator/SKILL.md", "skill_resources/test-case-generator/references/*.md"]
