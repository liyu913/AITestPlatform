# 方式二：仅中间件（本机跑前后端 / Celery）。在 deploy/ 目录执行 docker compose。
name: raina-testhub-infra

services:
  mysql:
    image: mysql:8.4
    container_name: raina-testhub-infra-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rainaroot}
      MYSQL_DATABASE: raina
      MYSQL_USER: raina
      MYSQL_PASSWORD: raina
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uraina", "-praina"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - raina-testhub-infra-network

  redis:
    image: redis:7-alpine
    container_name: raina-testhub-infra-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raina-testhub-infra-network

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: raina-testhub-infra-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      TZ: Asia/Shanghai
    volumes:
      - etcd_data:/etcd
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    networks:
      - raina-testhub-infra-network

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: raina-testhub-infra-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TZ: Asia/Shanghai
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"
    # 本机常被其它 MinIO 占用；默认映射到 19000/19001。Milvus 只走 compose 内网。
    ports:
      - "${MINIO_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    networks:
      - raina-testhub-infra-network

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: raina-testhub-infra-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      TZ: Asia/Shanghai
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HEALTH_PORT:-9091}:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - raina-testhub-infra-network

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:

networks:
  raina-testhub-infra-network:
    driver: bridge
